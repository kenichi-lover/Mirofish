<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ title }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <script src="/static/js/htmx.min.js" defer></script>
</head>

<body>

<header class="top-bar">
  {% if user %}
    <span class="nav-username">你好，{{ user.username }}</span>
    {# 登出由服务端 HX-Redirect 处理，无 JS #}
    <button class="btn-link" hx-post="/auth/logout" hx-swap="none">退出</button>
  {% else %}
    {# 唯一的登录按钮：打开原生 <dialog> #}
    <button class="btn-login"
            hx-on:click="document.getElementById('auth-modal').showModal()">登录</button>
  {% endif %}
</header>

<main>
  {% block content %}{% endblock %}
</main>

{% if not user %}
  {% include "partials/auth_modal.html" %}
{% endif %}

</body>
</html>
