{% extends "base.html" %}

{% block content %}
<section class="search-wrap">
  <div class="logo">Orbit</div>

  <form class="search-box"
        hx-post="/search"
        hx-target="#search-result"
        hx-swap="innerHTML"
        hx-indicator="#search-indicator">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" name="q" placeholder="搜索相册、标签..." autocomplete="off" autofocus>
  </form>

  <div class="search-btns">
    <button type="submit" form="search-form">Orbit 搜索</button>
  </div>

  {# hx-indicator：请求期间自动显示/隐藏 #}
  <div class="result" id="search-result">
    <span id="search-indicator" class="htmx-indicator">搜索中…</span>
  </div>
</section>
{% endblock %}
